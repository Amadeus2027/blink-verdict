[package]
name = "blink-verdict"
version = "0.1.0"
edition = "2021"
description = "A lightweight Windows AI decision overlay"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
png = "0.17"
windows = { version = "0.58", features = [
  "Foundation", "Foundation_Collections", "ApplicationModel_AppService", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common", "Foundation_Numerics", "Win32_Graphics_Gdi", "Win32_Security",
  "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
