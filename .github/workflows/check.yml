name: Windows build and core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_regressions:
        description: Run targeted worker recovery, rendering and DPI regressions
        type: boolean
        default: false
      settings_regressions:
        description: Run only settings persistence and local-model regressions
        type: boolean
        default: false
      release_candidate:
        description: Run release-only acceptance and package a candidate
        type: boolean
        default: false
      upload_only:
        description: Attach a validated candidate to an existing draft; never publish
        type: boolean
        default: false
      source_run:
        description: Successful candidate workflow run ID for attachment
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether optional component changed
        id: changed
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            $files = git diff --name-only $env:BASE_SHA HEAD
          } else {
            $files = git ls-files
          }
          $changed = [bool]($files | Where-Object { $_ -match '^(gamebar/|assets/wordart\.png)' })
          "gamebar=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Core tests only
        run: cargo test --locked --lib
      - name: Build native portable executable
        run: cargo build --locked --release
      - name: Record executable size
        shell: pwsh
        run: |
          $binary = Get-Item target/release/blink-verdict.exe
          "Native executable: $($binary.Length) bytes" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package development build with licenses
        shell: pwsh
        run: |
          python scripts/release/package.py --development
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item dist/blink-verdict-windows-x64-preview.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: blink-verdict-windows-x64-preview
          path: blink-verdict-windows-x64-preview.zip
      - uses: microsoft/setup-msbuild@v2
        if: steps.changed.outputs.gamebar == 'true'
      - name: Compile optional component when changed
        if: steps.changed.outputs.gamebar == 'true'
        run: msbuild gamebar/BlinkVerdict.GameBar.csproj /restore /p:Configuration=Debug /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.gamebar == 'true'
        with:
          name: blink-verdict-gamebar-unsigned-preview
          path: gamebar/AppPackages/
          if-no-files-found: error

  showcase-capture:
    if: github.event_name == 'workflow_dispatch' && !inputs.release_candidate && !inputs.upload_only && !inputs.settings_regressions && !inputs.runtime_regressions
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --lib
      - run: cargo build --locked --release
      - name: Record actual native settings and overlay
        shell: pwsh
        run: ./scripts/showcase/capture.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-frames
          path: showcase-frames/
          if-no-files-found: warn
  showcase-edit:
    needs: showcase-capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: native-ui-frames
          path: showcase-frames
      - name: Edit footage and export GIF
        run: |
          if ! command -v ffmpeg; then
            # Some runners have no FFmpeg; avoid the slow HTTP Azure mirror fallback.
            for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$apt_source_file" ]; then
                sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source_file"
              fi
            done
            sudo apt-get -o Acquire::Retries=1 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' --output "$RUNNER_TEMP/showcase-font.otf"
          python3 -m pip install --quiet 'Pillow>=11,<14'
          python3 scripts/showcase/render.py showcase-frames showcase-edit "$RUNNER_TEMP/showcase-font.otf"
      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-showcase-video
          path: |
            showcase-edit/blink-verdict-showcase.mp4
            showcase-edit/showcase.gif
            showcase-edit/showcase.json
      - name: Keep native captures and GIF on this branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p docs/assets/showcase
          cp showcase-edit/showcase.gif docs/assets/showcase.gif
          cp showcase-edit/blink-verdict-showcase.mp4 docs/assets/showcase.mp4
          cp showcase-edit/showcase.json docs/assets/showcase/provenance.json
          cp showcase-frames/0*.png docs/assets/showcase/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/showcase.gif docs/assets/showcase.mp4 docs/assets/showcase/
          git diff --cached --quiet || git commit -m "docs: record Windows native interface showcase"
          git push origin "HEAD:$BRANCH"

  release-candidate:
    if: github.event_name == 'workflow_dispatch' && (inputs.release_candidate || inputs.upload_only)
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      upload_only: ${{ inputs.upload_only == true || inputs.upload_only == 'true' }}
      source_run: ${{ fromJSON(inputs.source_run || '0') }}

  settings-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.settings_regressions
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Existing core groups and targeted native regressions only
        shell: pwsh
        run: |
          cargo test --locked --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --bin blink-verdict settings_regression -- --ignored --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  runtime-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_regressions
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build executable for real child-process regression
        run: cargo build --locked --release
      - name: Existing core groups and directly affected native regressions
        shell: pwsh
        run: |
          cargo test --locked --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:BLINK_VERDICT_TEST_EXE = (Resolve-Path target/release/blink-verdict.exe).Path
          cargo test --locked --bin blink-verdict regression -- --ignored --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
